    name: "Clover Sprout"
    category: "nature"
    rarity: "common"
    base_points: 10
    weight: 50
    active: true
    description: "A fresh green sprout picked along the path."
  - id: "item_uncommon"
    name: "Dew Crystal"
    category: "nature"
    rarity: "uncommon"
    base_points: 25
    weight: 28
