app:
  name: "TG Trails"
  version: "0.1.0"
  demo_mode: false

movement:
  cycle_required_s: 300
  demo_cycle_required_s: 20
  min_displacement_m: 75.0
  max_gap_s: 30.0
  max_accuracy_m: 30.0
  min_walk_speed_mps: 0.5
  max_walk_speed_mps: 3.5
  impossible_speed_mps: 12.0
  noise_floor_m: 3.0
  max_skew_s: 60.0

spawn:
  spawn_min_m: 80.0
  spawn_max_m: 250.0
  min_separation_m: 50.0
  collect_radius_m: 30.0
  retry_cooldown_s: 5.0

limits:
  max_collections_per_session: 12
  max_points_per_session: 600
  max_points_per_day: 1500
  max_session_duration_s: 10800
  raw_samples_keep_count: 200
  raw_samples_ttl_days: 7

items:
